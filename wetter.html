<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DO4LC - Wetterstation Mainburg (IMAINB38)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap');
    body { 
      font-family: 'Inter', sans-serif; background-color: #0b0c10; color: #ffffff;
      background-image: linear-gradient(rgba(11, 12, 16, 0.92), rgba(11, 12, 16, 0.92)), url('https://i.ibb.co/fYZ4n53r/jaesu.jpg');
      background-size: cover; background-position: center; background-attachment: fixed;
    }
    .font-mono-code { font-family: 'Fira Code', monospace; }
    .card-theme { 
      background: linear-gradient(145deg, #161a24, #0f121a); border: 1px solid #d4af37;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(212, 175, 55, 0.2);
    }
    .gold-border { border-color: #d4af37 !important; }
    .accent-color { color: #ff3b30; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

  <!-- Header -->
  <header class="sticky top-0 z-50 card-theme border-b backdrop-blur-md bg-opacity-90 shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-3">
          <div class="h-10 px-3 rounded-lg card-theme border gold-border flex items-center justify-center bg-black/50">
            <span class="font-mono-code font-bold text-xl tracking-wider accent-color">DO4LC</span>
          </div>
        </a>
        <nav class="hidden md:flex gap-6 text-sm font-medium items-center">
          <a href="index.html" class="hover:text-red-500 transition">Startseite</a>
          <a href="links.html" class="text-red-500 font-bold transition">Links</a>
          <a href="guestbook.html" class="hover:text-red-500 transition">Gästebuch</a>
        </nav>
        <a href="links.html" class="md:hidden text-xs font-mono-code px-3 py-1.5 rounded card-theme border gold-border text-amber-400">
          <i class="fa-solid fa-arrow-left mr-1"></i> Zurück
        </a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-6">
    <div class="text-center space-y-3">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full card-theme border text-xs font-mono-code">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span>PWS STATION ID: <strong class="text-amber-400">IMAINB38</strong> (Mainburg)</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">
        Wetterstation <span class="font-mono-code accent-color">Mainburg</span>
      </h1>
    </div>

    <!-- iFrame Box -->
    <div class="card-theme p-4 rounded-2xl border gold-border shadow-2xl overflow-hidden">
      <iframe src="https://www.wunderground.com/dashboard/pws/IMAINB38" 
              width="100%" 
              height="650px" 
              style="border:0; border-radius:12px; background:#0b0c10;" 
              loading="lazy">
      </iframe>
    </div>
  </main>

  <!-- Footer -->
  <footer class="card-theme border-t py-6 mt-12 font-mono-code text-xs text-slate-400 shadow-2xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between">
      <div><span class="accent-color font-bold">YAESU STATION</span> • © <span id="year"></span> DO4LC • Carsten</div>
      <div>Vy 73 de DO4LC</div>
    </div>
  </footer>
  <script>document.getElementById('year').innerText = new Date().getFullYear();</script>
